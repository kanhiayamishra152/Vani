<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Vani AI</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="btn-menu" class="icon-btn" aria-label="Open history menu"></button>
    <div class="brand">
      <img src="assets/logo-mark.svg" class="brand-mark" alt="" draggable="false">
      <span class="brand-name">Vani AI</span>
    </div>
    <div class="top-actions">
      <button id="btn-prompt-studio" class="icon-btn" aria-label="System Prompt Studio"></button>
      <button id="btn-new-chat-top" class="icon-btn" aria-label="New chat"></button>
    </div>
  </header>

  <div id="bridge-banner" hidden></div>

  <main id="screens">
    <section id="screen-chat" class="screen active" aria-label="Chat">
      <div id="chat-scroll">
        <div id="chat-list"></div>
        <div id="chat-empty" hidden></div>
      </div>
      <div id="composer">
        <div id="composer-status" class="composer-status" role="status" hidden></div>
        <div id="attach-preview" hidden></div>
        <div class="composer-bar">
          <button id="btn-attach" class="icon-btn" aria-label="Attach image"></button>
          <div class="composer-input-wrap">
            <textarea id="composer-input" rows="1" placeholder="Message Vani AI" autocomplete="off"></textarea>
          </div>
          <button id="btn-think" class="think-toggle" aria-label="Toggle model thinking" aria-pressed="true" title="Thinking: ON"></button>
          <button id="btn-auto-tts" class="icon-btn auto-tts" aria-label="Auto-speak replies: off" aria-pressed="false" title="Auto-speak replies: OFF"></button>
          <button id="btn-mic" class="icon-btn" aria-label="Dictate"></button>
          <button id="btn-stop" class="icon-btn stop" aria-label="Stop generating" hidden></button>
          <button id="btn-send" class="icon-btn send" aria-label="Send" hidden></button>
          <button id="btn-live" class="icon-btn live" aria-label="Open Live Talk"></button>
        </div>
      </div>
    </section>

    <section id="screen-models" class="screen" aria-label="Model Hub">
      <div class="screen-scroll" id="models-scroll"></div>
    </section>

    <section id="screen-settings" class="screen" aria-label="Settings">
      <div class="screen-scroll" id="settings-scroll"></div>
    </section>
  </main>

  <nav id="tabbar">
    <button class="tab active" data-tab="chat"><span class="tab-ic"></span><span class="tab-label">Chat</span></button>
    <button class="tab" data-tab="models"><span class="tab-ic"></span><span class="tab-label">Models</span></button>
    <button class="tab" data-tab="settings"><span class="tab-ic"></span><span class="tab-label">Settings</span></button>
  </nav>
</div>

<div id="drawer-scrim" hidden></div>
<aside id="drawer" aria-label="Chat history" hidden></aside>

<div id="live-root" hidden></div>
<div id="camera-root" hidden></div>
<div id="modal-root" hidden></div>
<div id="sheet-root" hidden></div>
<div id="slash-pop" hidden></div>
<div id="toast" role="status" hidden></div>

<script src="app.js"></script>
</body>
</html>
