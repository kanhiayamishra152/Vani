name: Build Vani AI APK

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release (v1.3.0)"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

env:
  # Release tag for this build. Immutable releases seal their assets at creation;
  # never delete one to retry (that permanently burns the tag). APK is
  # versionName 1.3.0 / versionCode 4, signed with the committed v1 keystore so
  # it installs in-place over v1.0.1 with no uninstall.
  RELEASE_TAG: "v1.3.0"
  NODE_VERSION: "20"
  GRADLE_VERSION: "8.7"
  ANDROID_PLATFORM: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_NDK: "27.0.12077973"
  ANDROID_CMAKE: "3.22.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK / NDK / CMake components (pre-installed runner SDK)
        run: |
          # ubuntu-latest ships an Android SDK; use it directly instead of a
          # third-party setup action. Add the pinned NDK + CMake + platform.
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for d in "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/cmdline-tools/bin" "$ANDROID_HOME/tools/bin"; do
              if [ -x "$d/sdkmanager" ]; then SDKMANAGER="$d/sdkmanager"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found; installing command-line tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-${ANDROID_PLATFORM}" \
                        "build-tools;${ANDROID_BUILD_TOOLS}" \
                        "ndk;${ANDROID_NDK}" \
                        "cmake;${ANDROID_CMAKE}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch native runtimes (llama.cpp + sherpa-onnx + silero VAD)
        run: node scripts/fetch-native-deps.mjs

      - name: Fetch + safely prepare OC-Lily VRM avatar
        run: |
          # Preserve the owner's original VRM byte-for-byte: no texture
          # downscaling, re-encoding or geometry optimization. The script only
          # audits the self-contained GLB before it is copied into the APK.
          node scripts/fetch-vrm.mjs
          node scripts/prepare-vrm-safe.mjs
          node scripts/prepare-vrm-safe.mjs --check

      - name: Generate launcher + splash icons
        run: node scripts/gen-icons.mjs

      - name: Build + size-gate the genuine <9 MiB four-voice TTS pack
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir onnx onnxruntime numpy sherpa-onnx==2.0.1
          node scripts/build-phonon-ultralight.mjs dist-tts --update-catalog
          python3 scripts/verify-paradee.py dist-tts/work/paradee_int8.onnx dist-tts/work/phonon-ultralight-8m-int8

      - name: Build web bundle into Android assets
        run: node scripts/build-web.mjs

      - name: Run unit + synthetic-rig + interactive browser checks
        run: |
          set -o pipefail
          {
            npm test
            node --test tests/*.test.mjs
            npm i --no-save --no-audit --no-fund playwright-core @sparticuz/chromium
            node tests/interactive.mjs
          } 2>&1 | tee /tmp/vani-tests.log

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          VANI_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VANI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VANI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/vani-v1.jks
            cat > android/keystore.properties <<EOF
          storeFile=vani-v1.jks
          storePassword=${VANI_STORE_PASSWORD:?KEYSTORE_PASSWORD secret required with KEYSTORE_BASE64}
          keyAlias=${VANI_KEY_ALIAS:-vani-v1}
          keyPassword=${VANI_KEY_PASSWORD:-$VANI_STORE_PASSWORD}
          EOF
            echo "Using keystore from repository secret"
          else
            if [ -f android/vani-v1.jks ] && [ -f android/keystore.properties ]; then
              # The established v1 key is persisted in the checkout. Reuse it;
              # never generate a replacement for a publishable update.
              bash scripts/gen-keystore.sh
              echo "Using the persisted repository v1 keystore"
            elif [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
              echo "ERROR: no persisted v1 keystore or KEYSTORE_BASE64; refusing a new incompatible signing key." >&2
              exit 1
            else
              # PR-only compile checks may use a disposable key; nothing from a
              # PR is published as an in-place update.
              bash scripts/gen-keystore.sh
              echo "Using a disposable PR-only key (release signing secret absent)"
            fi
          fi

      - name: Assemble release APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee /tmp/gradle.log

      - name: Report build error (diagnostic)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -f /tmp/vani-tests.log ]; then
            {
              echo "## Test failure (run ${{ github.run_id }})";
              echo '```';
              echo '----- beginning -----';
              head -n 180 /tmp/vani-tests.log;
              echo '----- end -----';
              tail -n 220 /tmp/vani-tests.log;
              echo '```';
            } > /tmp/diag.md
          elif [ -f /tmp/gradle.log ]; then
            {
              echo "## Gradle failure (run ${{ github.run_id }})";
              echo '```';
              grep -nE "error:|e: |FAILED|What went wrong|Caused by|Execution failed|> Task|CMake Error|ninja:|undefined reference|fatal error" /tmp/gradle.log | tail -n 120;
              echo "----- tail -----";
              tail -n 80 /tmp/gradle.log;
              echo '```';
            } > /tmp/diag.md
          else
            echo "No test or gradle log captured (failure before assemble)." > /tmp/diag.md
          fi
          BODY=$(python3 -c "import json,sys; print(json.dumps({'title':'CI build diagnostic','body':open('/tmp/diag.md').read()[:60000]}))")
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues" -d "$BODY" >/dev/null && echo "diagnostic issue posted" || echo "issue post failed"

      - name: Align + verify APK
        run: |
          mkdir -p dist
          BT="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"
          if [ ! -x "$BT/zipalign" ]; then
            BT=$(dirname "$(find "$ANDROID_HOME/build-tools" -name zipalign 2>/dev/null | sort -V | tail -1)")
          fi
          RAW=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          OUT=dist/vani-ai-1.3.0-release.apk
          echo "RAW=$RAW"; echo "BT=$BT"
          cp "$RAW" "$OUT"
          # AGP already zipaligns + signs. Verify alignment non-destructively;
          # re-aligning a signed APK would break its v2/v3 signature, so only
          # re-align + re-sign if the check actually fails.
          if "$BT/zipalign" -c -p 4 "$OUT"; then
            echo "APK is 4-byte aligned (AGP)"
          else
            echo "Re-aligning + re-signing"
            "$BT/zipalign" -f -p 4 "$RAW" "$OUT"
            SP=$(grep '^storePassword=' android/keystore.properties | cut -d= -f2-)
            KP=$(grep '^keyPassword=' android/keystore.properties | cut -d= -f2-)
            AL=$(grep '^keyAlias=' android/keystore.properties | cut -d= -f2-)
            "$BT/apksigner" sign --ks android/vani-v1.jks --ks-key-alias "$AL" --ks-pass "pass:$SP" --key-pass "pass:$KP" "$OUT"
          fi
          "$BT/apksigner" verify --print-certs "$OUT"
          ls -lh "$OUT"

      - name: Package source ZIP
        run: bash scripts/make-source-zip.sh

      - name: SHA-256 hashes
        run: |
          cd dist
          sha256sum vani-ai-1.3.0-release.apk vani-ai-1.3.0-source.zip | tee SHA256SUMS.txt
          cd ..
          sha256sum dist-tts/phonon-ultralight-8m-int8.tar.bz2 | sed 's#dist-tts/##' | tee -a dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vani-ai-1.3.0-release-apk
          path: |
            dist/vani-ai-1.3.0-release.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: vani-ai-1.3.0-source
          path: dist/vani-ai-1.3.0-source.zip
          if-no-files-found: error

      - name: Publish the Ultra-Light TTS pack release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          TTS_TAG=phonon-ultralight-v1
          TTS_ASSETS=(dist-tts/phonon-ultralight-8m-int8.tar.bz2 dist-tts/SHA256SUMS.txt dist-tts/size.json)
          if ! gh release view "$TTS_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TTS_TAG" --repo "$REPO" --target "$GITHUB_SHA" \
              --title "Vani Phonon Ultra-Light 8M INT8" \
              --notes "Genuine Paradee-8M v1.2 INT8 pack: four learned voices, 24 kHz, < 9 MiB. SHA-256 is included." \
              "${TTS_ASSETS[@]}"
          else
            if ! gh release view "$TTS_TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -qx 'phonon-ultralight-8m-int8.tar.bz2'; then
              echo "ERROR: $TTS_TAG exists without the required archive; refusing to replace an immutable release." >&2
              exit 1
            fi
            echo "$TTS_TAG already published; preserving its immutable assets."
          fi

      - name: Mirror published assets to gofile.io
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # If the release already exists (immutable), mirror ITS exact assets so
          # the gofile links + hashes match the published release; otherwise
          # upload the freshly built dist assets.
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --repo "$REPO" \
              -p 'vani-ai-1.3.0-release.apk' -p 'vani-ai-1.3.0-source.zip' -p 'SHA256SUMS.txt' \
              -D dist --clobber || true
          fi
          bash scripts/upload-gofile.sh

      - name: Publish Release (immutable-safe, assets attached at creation)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          # Body: intro + SHA-256 (matches dist assets) + gofile mirrors.
          cat scripts/release-intro.md > /tmp/body.md
          printf '\n### SHA-256\n```\n' >> /tmp/body.md
          cat dist/SHA256SUMS.txt >> /tmp/body.md
          printf '```\n' >> /tmp/body.md
          if [ -s dist/gofile-links.txt ]; then
            printf '\n### Mirrors (gofile.io)\n' >> /tmp/body.md
            cat dist/gofile-links.txt >> /tmp/body.md
          else
            printf '\n_Mirrors: gofile.io upload unavailable for this run._\n' >> /tmp/body.md
          fi

          ASSETS=(dist/vani-ai-1.3.0-release.apk dist/vani-ai-1.3.0-source.zip dist/SHA256SUMS.txt)

          if ! gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            # Immutable-safe: passing files to `gh release create` makes it create
            # a DRAFT, upload the assets, then publish — so assets are attached
            # before the release seals. (Create-empty-then-upload is rejected 422.)
            # NEVER delete an immutable release to retry: that burns the tag name.
            gh release create "$RELEASE_TAG" --repo "$REPO" --target "$GITHUB_SHA" \
              --title "Vani AI v1.3.0" --notes-file /tmp/body.md --latest "${ASSETS[@]}"
          else
            COUNT=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets | length')
            if [ "$COUNT" -ge 3 ]; then
              # Already published with assets: only title/notes may be refreshed.
              gh release edit "$RELEASE_TAG" --repo "$REPO" --title "Vani AI v1.3.0" --notes-file /tmp/body.md --latest
            else
              echo "ERROR: $RELEASE_TAG exists with only $COUNT assets and is immutable; cannot add assets or reuse the tag. Bump RELEASE_TAG." >&2
              exit 1
            fi
          fi

          # Verify the assets are attached.
          COUNT=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets | length')
          echo "Release $RELEASE_TAG assets: $COUNT"
          if [ "$COUNT" -lt 3 ]; then
            echo "ERROR: expected 3 assets, got $COUNT" >&2
            exit 1
          fi
          echo "Release $RELEASE_TAG finalized."
