name: Build Vani AI APK

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release v1.0.0"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

env:
  NODE_VERSION: "20"
  GRADLE_VERSION: "8.7"
  ANDROID_PLATFORM: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_NDK: "27.0.12077973"
  ANDROID_CMAKE: "3.22.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK / NDK / CMake components (pre-installed runner SDK)
        run: |
          # ubuntu-latest ships an Android SDK; use it directly instead of a
          # third-party setup action. Add the pinned NDK + CMake + platform.
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for d in "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/cmdline-tools/bin" "$ANDROID_HOME/tools/bin"; do
              if [ -x "$d/sdkmanager" ]; then SDKMANAGER="$d/sdkmanager"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found; installing command-line tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-${ANDROID_PLATFORM}" \
                        "build-tools;${ANDROID_BUILD_TOOLS}" \
                        "ndk;${ANDROID_NDK}" \
                        "cmake;${ANDROID_CMAKE}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch native runtimes (llama.cpp + sherpa-onnx + silero VAD)
        run: node scripts/fetch-native-deps.mjs

      - name: Fetch + optimize OC-Lily VRM avatar
        run: |
          node scripts/fetch-vrm.mjs
          node scripts/optimize-vrm.mjs

      - name: Generate launcher + splash icons
        run: node scripts/gen-icons.mjs

      - name: Build web bundle into Android assets
        run: node scripts/build-web.mjs

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          VANI_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VANI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VANI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/vani-v1.jks
            cat > android/keystore.properties <<EOF
          storeFile=vani-v1.jks
          storePassword=${VANI_STORE_PASSWORD:?KEYSTORE_PASSWORD secret required with KEYSTORE_BASE64}
          keyAlias=${VANI_KEY_ALIAS:-vani-v1}
          keyPassword=${VANI_KEY_PASSWORD:-$VANI_STORE_PASSWORD}
          EOF
            echo "Using keystore from repository secret"
          else
            # gen-keystore.sh creates the JKS AND a matching keystore.properties
            # (random password when no secret is set). Do not overwrite it.
            bash scripts/gen-keystore.sh
            echo "Generated fresh v1 keystore"
          fi

      - name: Assemble release APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee /tmp/gradle.log

      - name: Report build error (diagnostic)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -f /tmp/gradle.log ]; then
            {
              echo "## Gradle failure (run ${{ github.run_id }})";
              echo '```';
              grep -nE "error:|e: |FAILED|What went wrong|Caused by|Execution failed|> Task|CMake Error|ninja:|undefined reference|fatal error" /tmp/gradle.log | tail -n 120;
              echo "----- tail -----";
              tail -n 80 /tmp/gradle.log;
              echo '```';
            } > /tmp/diag.md
          else
            echo "No gradle.log captured (failure before assemble)." > /tmp/diag.md
          fi
          BODY=$(python3 -c "import json,sys; print(json.dumps({'title':'CI build diagnostic','body':open('/tmp/diag.md').read()[:60000]}))")
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues" -d "$BODY" >/dev/null && echo "diagnostic issue posted" || echo "issue post failed"

      - name: Align + verify APK
        run: |
          mkdir -p dist
          BT="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"
          RAW=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          "$BT/zipalign" -f -p 4 "$RAW" dist/vani-ai-1.0.0-release.apk
          "$BT/apksigner" verify --print-certs dist/vani-ai-1.0.0-release.apk
          ls -lh dist/vani-ai-1.0.0-release.apk

      - name: Package source ZIP
        run: bash scripts/make-source-zip.sh

      - name: SHA-256 hashes
        run: |
          cd dist
          sha256sum vani-ai-1.0.0-release.apk vani-ai-1.0.0-source.zip | tee SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vani-ai-1.0.0-release-apk
          path: |
            dist/vani-ai-1.0.0-release.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: vani-ai-1.0.0-source
          path: dist/vani-ai-1.0.0-source.zip
          if-no-files-found: error

      - name: Upload to gofile.io
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: bash scripts/upload-gofile.sh dist/vani-ai-1.0.0-release.apk dist/vani-ai-1.0.0-source.zip

      - name: Append mirror links to Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -s dist/gofile-links.txt ]; then
            ID=$(gh api "repos/$REPO/releases/tags/v1.0.0" --jq '.id')
            gh api "repos/$REPO/releases/$ID" --jq '.body' > /tmp/body.md
            printf '\n\n### Mirrors (gofile.io)\n' >> /tmp/body.md
            cat dist/gofile-links.txt >> /tmp/body.md
            gh api -X PATCH "repos/$REPO/releases/$ID" -F body=@/tmp/body.md >/dev/null && echo "mirror links appended to release"
          else
            echo "no gofile mirrors to append"
          fi

      - name: Publish GitHub Release v1.0.0
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Vani AI v1.0.0
          make_latest: "true"
          generate_release_notes: true
          files: |
            dist/vani-ai-1.0.0-release.apk
            dist/vani-ai-1.0.0-source.zip
            dist/SHA256SUMS.txt
          body: |
            ## Vani AI v1.0.0

            Standalone on-device AI companion for Android (arm64-v8a, minSdk 26).

            **Install:** download `vani-ai-1.0.0-release.apk`, enable "Install unknown apps", and sideload.

            - Chat with local GGUF models (llama.cpp), vision via mmproj, offline KaTeX math + code cards
            - Live Talk with the OC-Lily VRM avatar, hands-free VAD + instant barge-in, neural TTS
            - Model Hub with resumable native downloads (HTTP Range) and notifications
            - Pure monochrome design, zero cloud dependencies

            See `SHA256SUMS.txt` for integrity hashes.
