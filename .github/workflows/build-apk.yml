name: Build Vani AI APK

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release (v1.5.1)"
        type: boolean
        default: true
      release_tag:
        description: "Explicit tag to publish (use a unique tag for test builds)"
        type: string
        default: "v1.5.1"
      prerelease:
        description: "Mark this explicitly dispatched release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

env:
  # Release tag for this build. Immutable releases seal their assets at creation;
  # never delete one to retry (that permanently burns the tag). APK is
  # versionName 1.5.1 / versionCode 7, signed with the committed v1 keystore so
  # it installs in-place over v1.0.1 with no uninstall.
  RELEASE_TAG: ${{ inputs.release_tag || 'v1.5.1' }}
  NODE_VERSION: "20"
  GRADLE_VERSION: "8.7"
  ANDROID_PLATFORM: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_NDK: "27.0.12077973"
  ANDROID_CMAKE: "3.22.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK / NDK / CMake components (pre-installed runner SDK)
        run: |
          # ubuntu-latest ships an Android SDK; use it directly instead of a
          # third-party setup action. Add the pinned NDK + CMake + platform.
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for d in "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/cmdline-tools/bin" "$ANDROID_HOME/tools/bin"; do
              if [ -x "$d/sdkmanager" ]; then SDKMANAGER="$d/sdkmanager"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found; installing command-line tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-${ANDROID_PLATFORM}" \
                        "build-tools;${ANDROID_BUILD_TOOLS}" \
                        "ndk;${ANDROID_NDK}" \
                        "cmake;${ANDROID_CMAKE}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch native runtimes (llama.cpp + sherpa-onnx + silero VAD)
        run: node scripts/fetch-native-deps.mjs

      - name: Fetch + safely prepare OC-Lily VRM avatar
        run: |
          # Preserve the owner's original VRM byte-for-byte: no texture
          # downscaling, re-encoding or geometry optimization. The script only
          # audits the self-contained GLB before it is copied into the APK.
          node scripts/fetch-vrm.mjs
          node scripts/prepare-vrm-safe.mjs
          node scripts/prepare-vrm-safe.mjs --check

      - name: Generate launcher + splash icons
        run: node scripts/gen-icons.mjs

      - name: Build + size-gate the genuine <9 MiB four-voice TTS pack
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir onnx onnxruntime numpy sherpa-onnx==2.0.1
          node scripts/build-phonon-ultralight.mjs dist-tts --update-catalog
          python3 scripts/verify-paradee.py dist-tts/work/paradee_int8.onnx dist-tts/work/phonon-ultralight-8m-int8

      - name: Build web bundle into Android assets
        run: node scripts/build-web.mjs

      - name: Run unit + synthetic-rig + interactive browser checks
        run: |
          set -o pipefail
          {
            npm test
            node --test tests/*.test.mjs
            npm i --no-save --no-audit --no-fund playwright-core @sparticuz/chromium
            node tests/interactive.mjs
          } 2>&1 | tee /tmp/vani-tests.log

      - name: Prepare the tracked v1 signing key
        run: |
          # Update compatibility requires the exact established key, never a
          # possibly-different CI secret or a newly generated fallback key.
          if [ ! -f android/vani-v1.jks ] || [ ! -f android/keystore.properties ]; then
            echo "ERROR: tracked android/vani-v1.jks and keystore.properties are required." >&2
            exit 1
          fi
          bash scripts/gen-keystore.sh
          SP=$(grep '^storePassword=' android/keystore.properties | cut -d= -f2-)
          AL=$(grep '^keyAlias=' android/keystore.properties | cut -d= -f2-)
          keytool -exportcert -alias "$AL" -keystore android/vani-v1.jks \
            -storepass "$SP" -file /tmp/vani-release-key.der
          echo "Using the tracked v1 keystore; certificate exported for APK identity verification"

      - name: Assemble release APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee /tmp/gradle.log

      - name: Report build error (diagnostic)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -f /tmp/gradle.log ]; then
            {
              echo "## Gradle failure (run ${{ github.run_id }})";
              echo '```';
              grep -nE "error:|e: |FAILED|What went wrong|Caused by|Execution failed|> Task|CMake Error|ninja:|undefined reference|fatal error" /tmp/gradle.log | tail -n 120;
              echo "----- tail -----";
              tail -n 80 /tmp/gradle.log;
              echo '```';
            } > /tmp/diag.md
          elif [ -f /tmp/vani-tests.log ]; then
            {
              echo "## Test failure (run ${{ github.run_id }})";
              echo '```';
              echo '----- beginning -----';
              head -n 180 /tmp/vani-tests.log;
              echo '----- end -----';
              tail -n 220 /tmp/vani-tests.log;
              echo '```';
            } > /tmp/diag.md
          else
            echo "No test or gradle log captured (failure before assemble)." > /tmp/diag.md
          fi
          BODY=$(python3 -c "import json,sys; print(json.dumps({'title':'CI build diagnostic','body':open('/tmp/diag.md').read()[:60000]}))")
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues" -d "$BODY" >/dev/null && echo "diagnostic issue posted" || echo "issue post failed"

      - name: Align + verify Android installer compatibility
        run: |
          set -euo pipefail
          exec > >(tee /tmp/vani-package-gate.log) 2>&1
          mkdir -p dist
          BT="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"
          if [ ! -x "$BT/zipalign" ]; then
            BT=$(dirname "$(find "$ANDROID_HOME/build-tools" -name zipalign 2>/dev/null | sort -V | tail -1)")
          fi
          RAW=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          OUT=dist/vani-ai-1.5.1-release.apk
          echo "RAW=$RAW"; echo "BT=$BT"
          # Canonical release packaging: align first, then force both signatures.
          # AGP can emit v2-only APKs for minSdk 26 even when v1 is requested.
          ALIGNED=/tmp/vani-ai-1.5.1-aligned.apk
          "$BT/zipalign" -f -p 4 "$RAW" "$ALIGNED"
          SP=$(grep '^storePassword=' android/keystore.properties | cut -d= -f2-)
          KP=$(grep '^keyPassword=' android/keystore.properties | cut -d= -f2-)
          AL=$(grep '^keyAlias=' android/keystore.properties | cut -d= -f2-)
          "$BT/apksigner" sign --ks android/vani-v1.jks --ks-key-alias "$AL" \
            --ks-pass "pass:$SP" --key-pass "pass:$KP" \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled false --v4-signing-enabled false \
            --out "$OUT" "$ALIGNED"
          "$BT/zipalign" -c -p 4 "$OUT"
          unzip -t "$OUT" > /tmp/vani-apk-zip-test.log

          # Parse the final binary AndroidManifest with Android's own tooling.
          AAPT="$BT/aapt"
          "$AAPT" dump badging "$OUT" > /tmp/vani-badging.txt
          "$AAPT" dump xmltree "$OUT" AndroidManifest.xml > /tmp/vani-manifest.txt
          grep -F "package: name='ai.vani.app' versionCode='7' versionName='1.5.1'" /tmp/vani-badging.txt
          grep -F "sdkVersion:'26'" /tmp/vani-badging.txt
          grep -F "targetSdkVersion:'34'" /tmp/vani-badging.txt
          grep -F "native-code: 'arm64-v8a'" /tmp/vani-badging.txt
          # aapt prints binary XML booleans as 0xffffffff (some versions use true).
          grep -E 'android:extractNativeLibs.*(=true|0xffffffff)' /tmp/vani-manifest.txt

          # JNI libraries must use traditional compressed/extractable packaging;
          # the original VRM must remain byte-identical and STORED for WebView mmap.
          python3 - "$OUT" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              libs = [i for i in z.infolist() if i.filename.startswith('lib/') and i.filename.endswith('.so')]
              assert libs, 'no native libraries packaged'
              assert all(i.compress_type == zipfile.ZIP_DEFLATED for i in libs), 'non-extractable/uncompressed JNI library found'
              abis = {i.filename.split('/')[1] for i in libs}
              assert abis == {'arm64-v8a'}, f'unexpected ABI set: {abis}'
              vrm = [i for i in z.infolist() if i.filename.endswith('/assets/vrm/OC-Lily.vrm')]
              assert len(vrm) == 1, 'original OC-Lily.vrm missing from final APK'
              assert vrm[0].compress_type == zipfile.ZIP_STORED, 'VRM must remain uncompressed'
              print(f'Validated {len(libs)} compressed JNI libraries for {sorted(abis)}; original VRM is STORED')
          PY

          # Force verification of the legacy-compatible signature too. With the
          # manifest's minSdk 26, apksigner otherwise skips v1-only checks.
          "$BT/apksigner" verify --verbose --min-sdk-version 23 --print-certs "$OUT" | tee /tmp/vani-apk-signature.txt
          grep -F 'Verified using v1 scheme (JAR signing): true' /tmp/vani-apk-signature.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/vani-apk-signature.txt
          APK_CERT=$("$BT/apksigner" verify --print-certs "$OUT" | sed -nE 's/^Signer #1 certificate SHA-256 (digest|fingerprint): //p' | head -1 | tr 'A-F' 'a-f')
          KEY_CERT=$(openssl dgst -sha256 /tmp/vani-release-key.der | awk '{print $NF}' | tr 'A-F' 'a-f')
          if [ -z "$APK_CERT" ] || [ "$APK_CERT" != "$KEY_CERT" ]; then
            echo "ERROR: APK certificate does not match tracked android/vani-v1.jks" >&2
            exit 1
          fi
          echo "APK certificate matches the tracked v1 key: $APK_CERT"
          ls -lh "$OUT"

      - name: Report APK package verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "## APK verification failure (run ${{ github.run_id }})";
            echo "Commit: $GITHUB_SHA";
            for f in /tmp/vani-package-gate.log /tmp/vani-badging.txt /tmp/vani-manifest.txt /tmp/vani-apk-signature.txt /tmp/vani-apk-zip-test.log; do
              if [ -f "$f" ]; then
                echo; echo "### $f"; echo '```';
                tail -n 220 "$f";
                echo '```';
              fi
            done
            if compgen -G 'dist/*.apk' > /dev/null; then
              echo; echo '### APK files'; ls -lh dist/*.apk;
            fi
          } > /tmp/vani-apk-diagnostic.md
          BODY=$(python3 -c "import json; print(json.dumps({'title':'APK package verification diagnostic','body':open('/tmp/vani-apk-diagnostic.md').read()[:60000]}))")
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues" -d "$BODY" >/dev/null

      - name: Package source ZIP
        run: bash scripts/make-source-zip.sh

      - name: SHA-256 hashes
        run: |
          cd dist
          sha256sum vani-ai-1.5.1-release.apk vani-ai-1.5.1-source.zip | tee SHA256SUMS.txt
          cd ..
          sha256sum dist-tts/phonon-ultralight-8m-int8.tar.bz2 | sed 's#dist-tts/##' | tee -a dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vani-ai-1.5.1-release-apk
          path: |
            dist/vani-ai-1.5.1-release.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: vani-ai-1.5.1-source
          path: dist/vani-ai-1.5.1-source.zip
          if-no-files-found: error

      - name: Publish the Ultra-Light TTS pack release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          TTS_TAG=phonon-ultralight-v1
          TTS_ASSETS=(dist-tts/phonon-ultralight-8m-int8.tar.bz2 dist-tts/SHA256SUMS.txt dist-tts/size.json)
          if ! gh release view "$TTS_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TTS_TAG" --repo "$REPO" --target "$GITHUB_SHA" \
              --title "Vani Phonon Ultra-Light 8M INT8" \
              --notes "Genuine Paradee-8M v1.2 INT8 pack: four learned voices, 24 kHz, < 9 MiB. SHA-256 is included." \
              "${TTS_ASSETS[@]}"
          else
            if ! gh release view "$TTS_TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -qx 'phonon-ultralight-8m-int8.tar.bz2'; then
              echo "ERROR: $TTS_TAG exists without the required archive; refusing to replace an immutable release." >&2
              exit 1
            fi
            echo "$TTS_TAG already published; preserving its immutable assets."
          fi

      - name: Mirror published assets to gofile.io
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # If the release already exists (immutable), mirror ITS exact assets so
          # the gofile links + hashes match the published release; otherwise
          # upload the freshly built dist assets.
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --repo "$REPO" \
              -p 'vani-ai-1.5.1-release.apk' -p 'vani-ai-1.5.1-source.zip' -p 'SHA256SUMS.txt' \
              -D dist --clobber || true
          fi
          bash scripts/upload-gofile.sh

      - name: Publish Release (immutable-safe, assets attached at creation)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -uo pipefail
          # Body: intro + SHA-256 (matches dist assets) + gofile mirrors.
          cat scripts/release-intro.md > /tmp/body.md
          printf '\n### SHA-256\n```\n' >> /tmp/body.md
          cat dist/SHA256SUMS.txt >> /tmp/body.md
          printf '```\n' >> /tmp/body.md
          if [ -s dist/gofile-links.txt ]; then
            printf '\n### Mirrors (gofile.io)\n' >> /tmp/body.md
            cat dist/gofile-links.txt >> /tmp/body.md
          else
            printf '\n_Mirrors: gofile.io upload unavailable for this run._\n' >> /tmp/body.md
          fi

          if [ "$PRERELEASE" = "true" ]; then
            { printf '**Temporary test build** from commit `%s`. Not a production release.\n\n' "$GITHUB_SHA"; cat /tmp/body.md; } > /tmp/test-body.md
            mv /tmp/test-body.md /tmp/body.md
          fi

          ASSETS=(dist/vani-ai-1.5.1-release.apk dist/vani-ai-1.5.1-source.zip dist/SHA256SUMS.txt)
          RELEASE_FLAGS=(--latest)
          if [ "$PRERELEASE" = "true" ]; then RELEASE_FLAGS=(--prerelease); fi

          if ! gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            # Immutable-safe: passing files to `gh release create` makes it create
            # a DRAFT, upload the assets, then publish — so assets are attached
            # before the release seals. (Create-empty-then-upload is rejected 422.)
            # NEVER delete an immutable release to retry: that burns the tag name.
            gh release create "$RELEASE_TAG" --repo "$REPO" --target "$GITHUB_SHA" \
              --title "Vani AI $RELEASE_TAG" --notes-file /tmp/body.md "${RELEASE_FLAGS[@]}" "${ASSETS[@]}"
          else
            COUNT=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets | length')
            if [ "$COUNT" -ge 3 ]; then
              # An existing tag and its notes belong to the original immutable
              # assets. Never attach this run's different hashes to that release.
              echo "$RELEASE_TAG already published; preserving its assets and notes. Bump RELEASE_TAG for a new release."
            else
              echo "ERROR: $RELEASE_TAG exists with only $COUNT assets and is immutable; cannot add assets or reuse the tag. Bump RELEASE_TAG." >&2
              exit 1
            fi
          fi

          # Verify the assets are attached.
          COUNT=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets | length')
          echo "Release $RELEASE_TAG assets: $COUNT"
          if [ "$COUNT" -lt 3 ]; then
            echo "ERROR: expected 3 assets, got $COUNT" >&2
            exit 1
          fi
          echo "Release $RELEASE_TAG finalized."
