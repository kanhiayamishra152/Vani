plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'ai.vani.app'
    compileSdk 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'ai.vani.app'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          "-DLLAMA_DIR=${rootProject.projectDir}/../third_party/llama.cpp"
                cppFlags '-O3', '-fexceptions', '-frtti'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    // VRM / ONNX assets stay STORED (uncompressed) for instant mmap loads.
    androidResources { noCompress += ['vrm', 'glb', 'onnx'] }
    packaging { jniLibs { useLegacyPackaging = false } }
    buildFeatures { buildConfig true }
}

dependencies {
    // Pinned sherpa-onnx runtime (local TTS / ASR / VAD), fetched by scripts/fetch-native-deps.mjs
    implementation files('libs/sherpa-onnx-2.0.1.aar')
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}
